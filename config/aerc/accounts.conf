# aerc accounts. Mail is read from the local Maildir that mbsync fills, and
# sent with msmtp; passwords stay in pass (see ~/.config/isyncrc and
# ~/.config/msmtp/config). check-mail runs mailsync once when aerc starts.

[marufcorp]
source             = maildir://~/.local/share/mail/marufcorp
outgoing           = /opt/homebrew/bin/msmtp -a marufcorp
from               = Maruf Jony <marufcorp@gmail.com>
default            = INBOX
postpone           = Drafts
archive            = Archive
folders-sort       = INBOX,Archive,Sent,Drafts,Trash
check-mail         = 24h
check-mail-cmd     = ~/.config/mail/mailsync marufcorp
check-mail-timeout = 15m
