# aerc: 3 columns (folders | messages | reading pane).
# Opened through the `aerc` shell function in ~/.config/zsh/.zshrc, which
# unlocks pass and sizes the reading pane to ~65% of the window.
# Mail comes from ~/.local/share/mail (synced by ~/.config/mail/mailsync).

[general]
default-save-path = ~/Downloads

[ui]
index-columns = flags:4,name<20,subject,date>12
column-date = {{.DateAutoFormat .Date.Local}}
sidebar-width = 20
# list width in cells; the aerc shell function rewrites this on launch
message-list-split = vertical 60
styleset-name = catppuccin
threading-enabled = true
sort = -r date
mouse-enabled = true
fuzzy-complete = true
dirlist-left = {{.Folder}}
dirlist-right = {{if .Unread}}{{humanReadable .Unread}}{{end}}
border-char-vertical = "│"
border-char-horizontal = "─"
empty-message = (empty)

[viewer]
pager = less -Rc
alternatives = text/plain,text/html
header-layout = From|To,Cc|Bcc,Date,Subject
always-show-mime = true
parse-http-links = true

[compose]
editor = nvim +':set tw=72 fo+=w spell'
address-book-cmd = sh -c "notmuch address --deduplicate=address --output=sender --output=recipients -- '%s' | sed -E 's/^(.*) <(.*)>$/\\2\t\\1/'"
empty-subject-warning = true
no-attachment-warning = ^[^>]*\b(attach|attached|attachment|bifoga|bifogad)\b

[multipart-converters]

# How each part is shown in the reading pane (first match wins)
[filters]
text/plain = colorize
text/calendar = calendar
message/delivery-status = colorize
message/rfc822 = colorize
text/html = html | colorize
application/pdf = pdftotext -layout -l 20 - -
application/vnd.openxmlformats-officedocument.spreadsheetml.sheet = ~/.config/mail/xlsx-preview
.filename,~\.xlsx$ = ~/.config/mail/xlsx-preview
application/vnd.openxmlformats-officedocument.wordprocessingml.document = pandoc -f docx -t plain
.filename,~\.docx$ = pandoc -f docx -t plain
.filename,~\.pdf$ = pdftotext -layout -l 20 - -
text/csv = column -s, -t
.headers = colorize

# What :open (Enter / l / o in the reading view) and :open-link use
[openers]
x-scheme-handler/http* = open {}
x-scheme-handler/mailto = open {}
*/* = ~/.config/mail/mail-open {}

[hooks]

[templates]
