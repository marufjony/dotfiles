# aerc: 3 columns (folders | messages | reading pane).
# Opened through the `aerc` shell function in ~/.config/zsh/.zshrc, which
# unlocks pass and sizes the reading pane to ~65% of the window.
# Mail comes from ~/.local/share/mail (synced by ~/.config/mail/mailsync).

[general]
default-save-path = ~/Downloads

[ui]
index-columns = flags:4,name<20,subject,date>12
column-flags = {{.StyleSwitch (.Flags | join "") (case `!` "flag-flagged") (case `N` "flag-new") (case `r` "flag-replied") (case `a` "flag-attach")}}
column-name = {{if match .Folder "^(Sent|Drafts)$"}}{{.Style (index (.To | names) 0) "sender"}}{{else}}{{.Style (index (.From | names) 0) "sender"}}{{end}}
column-subject = {{.Style .ThreadPrefix "date"}}{{.Subject}}
column-date = {{.Style (.DateAutoFormat .Date.Local) "date"}}
sidebar-width = 20
# list width in cells; the aerc shell function rewrites this on launch
message-list-split = vertical 60
styleset-name = catppuccin-mocha
threading-enabled = true
sort = -r date
mouse-enabled = true
fuzzy-complete = true
dirlist-left = {{.StyleSwitch (switch .Folder (case `^INBOX$` "\uf01c  Inbox") (case `^Archive$` "\uf187  Archive") (case `^Sent$` "\uf1d8  Sent") (case `^Drafts$` "\uf044  Drafts") (case `^Trash$` "\uf1f8  Trash") (default (printf "\uf07b  %s" .Folder))) (case `Inbox$` "folder-inbox") (case `Sent$` "folder-sent") (case `Archive$` "folder-archive") (case `Drafts$` "folder-drafts") (case `Trash$` "folder-trash")}}
dirlist-right = {{if .Unread}}{{.Style (humanReadable .Unread) "count"}}{{end}}
border-char-vertical = "│"
border-char-horizontal = "─"
empty-message = (empty)
tab-title-account = {{.AccountFrom.Name}}: {{.AccountFrom.Address}}

# Bottom bar:   unread · mail size        (search/keys)        last sync · status
# Icons are Nerd Font glyphs (built into Ghostty/WezTerm/kitty; Warp uses
# JetBrainsMono Nerd Font). Size, sync time and status come from
# ~/.config/aerc/filters/mail-status, which reads what mailsync saves after each sync.
[statusline]
column-left = {{.Style " \uf0e0 " "sb-unread"}}{{.Unread "INBOX"}} unread{{.Style "   │   " "sb-sep"}}{{.Style "\uf1c0 " "sb-size"}}{{exec (printf "mail-status size %s" .Account) ""}}
column-center = {{.ContentInfo}} {{.PendingKeys}}
column-right = {{.Style "\uf021 " "sb-sync"}}{{exec (printf "mail-status synced %s" .Account) ""}}{{.Style "   │   " "sb-sep"}}{{$st := exec (printf "mail-status state %s" .Account) ""}}{{.StyleSwitch (printf "%s %s" (switch $st (case "Connected" "\uf058") (case "Syncing" "\uf110") (default "\uf057")) $st) (case "^.? ?Connected" "sb-ok") (case "Syncing" "sb-busy") (default "sb-bad")}} 

[viewer]
pager = less -Rc
alternatives = text/plain,text/html
header-layout = From|To,Cc|Bcc,Date,Subject
always-show-mime = true
parse-http-links = true

[compose]
editor = nvim +':set tw=72 fo+=w spell'
address-book-cmd = sh -c "notmuch address --deduplicate=address --output=sender --output=recipients -- '%s' | sed -E 's/^(.*) <(.*)>$/\\2\t\\1/'"
empty-subject-warning = true
no-attachment-warning = ^[^>]*\b(attach|attached|attachment|bifoga|bifogad)\b

[multipart-converters]

# How each part is shown in the reading pane (first match wins)
[filters]
text/plain = colorize
text/calendar = calendar
message/delivery-status = colorize
message/rfc822 = colorize
text/html = html | colorize
application/pdf = pdftotext -layout -l 20 - -
application/vnd.openxmlformats-officedocument.spreadsheetml.sheet = ~/.config/mail/xlsx-preview
.filename,~\.xlsx$ = ~/.config/mail/xlsx-preview
application/vnd.openxmlformats-officedocument.wordprocessingml.document = pandoc -f docx -t plain
.filename,~\.docx$ = pandoc -f docx -t plain
.filename,~\.pdf$ = pdftotext -layout -l 20 - -
text/csv = column -s, -t
.headers = colorize

# What :open (Enter / l / o in the reading view) and :open-link use
[openers]
x-scheme-handler/http* = open {}
x-scheme-handler/mailto = open {}
*/* = ~/.config/mail/mail-open {}

[hooks]

[templates]
