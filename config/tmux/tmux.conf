# Optimized tmux configuration

# ========== Basic Settings ==========

# Enable 256 color support
#set-option -g default-terminal 'screen-254color'
#set-option -g terminal-overrides ',xterm-256color:RGB'

# Set prefix key to Ctrl-A
#set -g prefix C-s
set -g prefix `

# Start window indexing at 1 (default is 0)
set -g base-index 1

# Don't exit tmux when closing a session
set -g detach-on-destroy off

# Remove delay when pressing Esc
set -g escape-time 0

# Increase scrollback buffer size
set -g history-limit 1000000

# Automatically renumber windows when one is closed
set -g renumber-windows on

# Enable system clipboard integration
set -g set-clipboard on

# Move status bar to the top
set -g status-position top

# Use vi key bindings in copy mode
setw -g mode-keys vi

# ========== Key Bindings ==========

# Reload tmux config
bind R source-file ~/.config/tmux/tmux.conf

# Window management
bind ^C new-window -c "$HOME"      # Create new window
bind H previous-window             # Go to previous window
bind L next-window                 # Go to next window
bind ^A last-window                # Go to last active window
bind r command-prompt "rename-window %%"  # Rename current window

# Pane management
bind | split-window -h -c "#{pane_current_path}"  # Split horizontally
bind - split-window -v -c "#{pane_current_path}"  # Split vertically
bind z resize-pane -Z                             # Toggle pane zoom

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing

set -g mouse on
#bind -r , resize-pane -L 5
#bind -r . resize-pane -R 5
#bind -r - resize-pane -D 5
#bind -r = resize-pane -U 5

# Other useful bindings
bind * setw synchronize-panes  # Toggle synchronize-panes
bind c kill-pane               # Close current pane
bind x swap-pane -D            # Swap current pane with the next one

# ========== Plugin Manager ==========

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
#set -g @plugin 'tmux-plugins/tmux-resurrect'
#set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'omerxx/catppuccin-tmux'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'omerxx/tmux-floax'

# ========== Plugin Configurations ==========

# Tmux-continuum settings
#set -g @continuum-restore 'on'  # Automatically restore tmux sessions on startup

# Tmux-resurrect settings
#set -g @resurrect-strategy-nvim 'session'  # Restore Neovim sessions

# Tmux-fzf-url settings
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

# Tmux-floax settings
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'magenta'
set -g @floax-text-color 'blue'


set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag,(),}"
set -g @catppuccin_status_modules_right "directory meetings date_time"
set -g @catppuccin_status_modules_left "session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_directory_text "#{b:pane_current_path}"
set -g @catppuccin_meetings_text "#($HOME/.config/tmux/scripts/cal.sh)"
set -g @catppuccin_date_time_text "%H:%M"

# ========== Custom Styles ==========

# Pane border styles
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'

# ========== Custom Key Bindings ==========

# Open Obsidian notes (requires Neovim and Obsidian.nvim plugin)
bind-key -n C-n display-popup -E nvim -c ":ObsidianNew"
bind-key -n C-q display-popup -w "90%" -h "85%" -E nvim -c ":ObsidianSearch"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
