import = [
    "~/.config/alacritty/themes/catppuccin-macchiato.toml"
]
[font]
size = 17

[font.normal]
family = "JetBrainsMono Nerd Font"
# style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
# style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
# style = "Italic"


[keyboard]
bindings = [
  { key = "Right", mods = "Alt", chars = "\u001BF" },
  { key = "Left",  mods = "Alt", chars = "\u001BB" },
  { key = "F",     mods = "Alt", action = "ToggleSimpleFullscreen" },
  { key = "Q",     mods = "Command",  action = "None" },
]

[window]
# startup_mode = "SimpleFullscreen"
decorations = "Buttonless"
opacity = 0.6
blur = true

[window.padding]
x = 5
y = 0

[window.dimensions]
columns = 250
lines = 90

[window.position]
x = 800
y = 150

